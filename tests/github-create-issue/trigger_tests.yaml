shouldTriggerPrompts:
  - "create a GitHub issue for this bug"
  - "file a new issue in my repository"
  - "help me choose an issue template"
  - "check whether this GitHub issue already exists"
  - "create an issue and set its labels and assignee"
  - "prepare an issue with the right milestone"

shouldNotTriggerPrompts:

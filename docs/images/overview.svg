<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" role="img" aria-labelledby="title description">
  <title id="title">PlagueHO Copilot Catalog</title>
  <desc id="description">Eleven plugins compose twenty-eight skills, five agents, and one canvas extension.</desc>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <style>
    .heading { fill: #f0f6fc; font: 700 25px "Segoe UI", system-ui, sans-serif; }
    .subtitle { fill: #8b949e; font: 14px "Segoe UI", system-ui, sans-serif; }
    .count { fill: #58a6ff; font: 700 28px "Segoe UI", system-ui, sans-serif; }
    .label { fill: #c9d1d9; font: 13px "Segoe UI", system-ui, sans-serif; }
    .catalog { fill: #7ee787; font: 12px "SFMono-Regular", Consolas, monospace; }
  </style>
  <rect width="840" height="240" rx="12" fill="url(#background)"/>
  <rect x="1" y="1" width="838" height="238" rx="11" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text class="heading" x="36" y="48">PlagueHO Copilot Catalog</text>
  <text class="subtitle" x="36" y="72">Reusable resources on main, installable plugins on the generated marketplace branch</text>
  <g transform="translate(36 98)">
    <text class="count" x="0" y="28">11</text>
    <text class="label" x="0" y="50">plugins</text>
    <text class="count" x="118" y="28">28</text>
    <text class="label" x="118" y="50">skills</text>
    <text class="count" x="236" y="28">5</text>
    <text class="label" x="236" y="50">agents</text>
    <text class="count" x="354" y="28">1</text>
    <text class="label" x="354" y="50">canvas extension</text>
  </g>
  <text class="catalog" x="36" y="178">azure-architecture-center · azure-infrastructure-deployment · content-and-learning · developer-environment</text>
  <text class="catalog" x="36" y="200">dotnet-modernization · github-workflows · microsoft-technical-research · powershell-modernization · skill-lifecycle</text>
  <text class="catalog" x="36" y="222">suggest-awesome-github-copilot · windows-app-storage-inspector-cleanup</text>
</svg>

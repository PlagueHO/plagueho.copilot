name: Bug report
description: Report a problem with a skill, plugin, or extension.
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please remove secrets and other sensitive information before submitting.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Clearly describe what went wrong.
      placeholder: Tell us what happened.
    validations:
      required: true

  - type: input
    id: plugin
    attributes:
      label: Plugin
      description: Which plugin is affected?
      placeholder: windows-app-storage-inspector-cleanup
    validations:
      required: true

  - type: input
    id: skill
    attributes:
      label: Skill, canvas, or extension
      description: Which specific resource is affected?
      placeholder: storage-inspector
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Agent runtime
      description: Where did you encounter the problem?
      options:
        - GitHub Copilot app
        - VS Code Copilot Chat
        - GitHub Copilot CLI
        - Claude Code
        - Other
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste relevant output or describe attached screenshots. Remove secrets and personal data.
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, links, or workarounds.
